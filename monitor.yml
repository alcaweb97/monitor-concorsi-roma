name: Monitor Concorsi Roma

on:
  schedule:
    # Ogni 2 ore al minuto 17 (timezone UTC)
    - cron: '17 */2 * * *'
  workflow_dispatch:  # Permette esecuzione manuale dal pannello GitHub

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
        run: python monitor.py

      - name: Commit e push stato aggiornato
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json || true
          git diff --cached --quiet || git commit -m "Aggiorna stato concorsi [$(date +%Y-%m-%d_%H:%M)]"
          git push
